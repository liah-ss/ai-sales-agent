map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

map $args $catalog_robots_tag {
  default "";
  ~*(^|&)(q|hot|sort)=[^&]* "noindex, follow";
}

server {
  listen 3000;
  server_name _;
  # Keep redirects origin-relative so Docker host ports and upstream HTTPS
  # origins are preserved instead of being rewritten from the container's
  # internal port 80.
  absolute_redirect off;

  root /usr/share/nginx/html;
  index index.html;
  error_page 404 /404-static.html;

  client_max_body_size 40m;

  # Compress text responses while leaving COS-hosted images untouched.
  gzip on;
  gzip_static on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/rss+xml image/svg+xml;

  sub_filter_once on;
  sub_filter '</body>' '<script src="/language-fix.js"></script></body>';

  location /api/ {
    proxy_http_version 1.1;
    proxy_pass http://backend:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /uploads/ {
    proxy_pass http://backend:8000/uploads/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files /index.html =404;
  }

  location = /404-static.html {
    internal;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  location = / {
    return 301 /id/;
  }

  # The production build omits Chinese pages while the backup build keeps
  # them. Serve generated Chinese files when present; otherwise redirect the
  # same path to the primary Indonesian locale without maintaining two configs.
  location ~ ^/zh-cn(?<zh_locale_path>/.*)?$ {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files $uri/index.html $uri $uri/ @zh_cn_missing;
  }

  location @zh_cn_missing {
    return 301 /id$zh_locale_path;
  }

  # Invalid paginated catalog/content URLs must be real 404 responses instead
  # of falling through to the SPA shell, otherwise crawlers index soft 404s.
  location ~ ^/(id|en|zh-cn)/(products|news|delivery-cases)(/category/[^/]+)?/page/[0-9]+/?$ {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header X-Robots-Tag $catalog_robots_tag always;
    try_files $uri/index.html =404;
  }

  location ^~ /_nuxt/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
    try_files $uri =404;
  }

  location = /language-fix.js {
    add_header Cache-Control "public, max-age=300";
    default_type application/javascript;
    try_files /language-fix.js =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header X-Robots-Tag $catalog_robots_tag always;
    # Serve generated route indexes directly so clean URLs do not redirect
    # to a trailing slash before crawlers receive the HTML document.
    try_files $uri/index.html $uri $uri/ =404;
  }
}
